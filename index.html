<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Execution Curve</title>
<link rel="icon" type="image/png" href="logo.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
<!-- Supabase MUST be outside style tag -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --black: #0A0A0A;
    --white: #FAFAFA;
    --amber: #C8873F;
    --amber-dim: #8A5C28;
    --gray-1: #6B6B6B;
    --gray-2: #D4D4D4;
    --gray-3: #F0F0F0;
    --display: 'Syne', sans-serif;
    --mono: 'DM Mono', monospace;
    --body: 'IBM Plex Sans', sans-serif;
  }

  html { scroll-behavior: smooth; }

  body {
    background: var(--white);
    color: var(--black);
    font-family: var(--body);
    font-size: 16px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1.25rem 3rem;
    background: var(--white);
    border-bottom: 1px solid var(--gray-2);
  }

  .nav-logo { 
    display: flex;
    align-items: center;
    gap: 0.6rem;
    font-family: var(--mono); 
    font-weight: 500; 
    font-size: 0.9rem; 
    letter-spacing: -0.01em; 
    color: var(--black); 
    text-decoration: none; 
  }
  .nav-logo span { color: var(--amber); }

  .logo-img {
    height: 28px;
    width: auto;
    display: block;
    object-fit: contain;
  }

  .nav-links { display: flex; gap: 2rem; list-style: none; }
  .nav-links a { font-family: var(--body); font-size: 0.875rem; font-weight: 400; color: var(--gray-1); text-decoration: none; transition: color 0.2s; }
  .nav-links a:hover { color: var(--black); }

  @media (max-width: 768px) { .nav-links { display: none; } }

  /* PROJECT SWITCHER */
  .project-switcher {
    position: relative;
    display: inline-flex;
    align-items: center;
  }

  .btn-project-switch {
    font-family: var(--mono);
    font-size: 0.68rem;
    color: var(--black);
    background: var(--gray-3);
    border: 1px solid var(--gray-2);
    padding: 0.3rem 0.75rem;
    cursor: pointer;
    letter-spacing: 0.02em;
    display: flex;
    align-items: center;
    gap: 0.4rem;
    transition: border-color 0.15s;
    max-width: 160px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .btn-project-switch:hover { border-color: var(--amber); }
  .btn-project-switch .project-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }

  .project-dropdown {
    position: absolute;
    top: calc(100% + 0.5rem);
    left: 0;
    background: var(--white);
    border: 1px solid var(--gray-2);
    min-width: 220px;
    z-index: 400;
    display: none;
    flex-direction: column;
    box-shadow: 0 4px 16px rgba(0,0,0,0.08);
  }

  .project-dropdown.show { display: flex; }

  .project-dropdown-item {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    padding: 0.75rem 1rem;
    font-family: var(--body);
    font-size: 0.85rem;
    color: var(--black);
    cursor: pointer;
    border: none;
    background: none;
    text-align: left;
    transition: background 0.15s;
    width: 100%;
  }

  .project-dropdown-item:hover { background: var(--gray-3); }
  .project-dropdown-item.active { background: var(--gray-3); font-weight: 500; }
  .project-dropdown-item .item-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }

  .project-dropdown-divider { border: none; border-top: 1px solid var(--gray-2); margin: 0; }

  .btn-new-project {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    padding: 0.75rem 1rem;
    font-family: var(--mono);
    font-size: 0.7rem;
    color: var(--amber);
    cursor: pointer;
    border: none;
    background: none;
    text-align: left;
    letter-spacing: 0.02em;
    transition: background 0.15s;
    width: 100%;
  }

  .btn-new-project:hover { background: var(--gray-3); }

  /* NEW PROJECT MODAL */
  .new-project-overlay { position: fixed; inset: 0; background: rgba(10,10,10,0.75); z-index: 700; display: none; align-items: center; justify-content: center; }
  .new-project-overlay.show { display: flex; }
  .new-project-box { background: var(--white); border: 1px solid var(--gray-2); padding: 2rem; max-width: 400px; width: calc(100% - 2rem); }
  .new-project-label { font-family: var(--mono); font-size: 0.62rem; color: var(--amber); letter-spacing: 0.08em; display: block; margin-bottom: 0.75rem; }
  .new-project-box h3 { font-family: var(--display); font-size: 1.2rem; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 1.25rem; }
  .new-project-input { width: 100%; font-family: var(--body); font-size: 0.9rem; color: var(--black); background: var(--gray-3); border: 1px solid var(--gray-2); padding: 0.75rem 1rem; outline: none; margin-bottom: 0.75rem; transition: border-color 0.15s; }
  .new-project-input:focus { border-color: var(--amber); }
  .new-project-input::placeholder { color: var(--gray-1); }
  .color-picker-row { display: flex; gap: 0.5rem; margin-bottom: 1.25rem; flex-wrap: wrap; }
  .color-swatch { width: 1.5rem; height: 1.5rem; border-radius: 50%; border: 2px solid transparent; cursor: pointer; transition: border-color 0.15s; }
  .color-swatch.selected { border-color: var(--black); }
  .new-project-actions { display: flex; gap: 0.75rem; justify-content: flex-end; }
  .btn-project-cancel { font-family: var(--mono); font-size: 0.72rem; color: var(--gray-1); background: none; border: 1px solid var(--gray-2); padding: 0.5rem 1rem; cursor: pointer; }
  .btn-project-create { font-family: var(--mono); font-size: 0.72rem; color: var(--white); background: var(--black); border: none; padding: 0.5rem 1.25rem; cursor: pointer; transition: background 0.15s; }
  .btn-project-create:hover { background: var(--amber); }
  .btn-project-create:disabled { opacity: 0.35; cursor: default; background: var(--black); }

  /* CONSISTENCY INDICATOR */
  .consistency-wrap {
    display: inline-flex;
    align-items: center;
    gap: 0.75rem;
    font-family: var(--mono);
    font-size: 0.65rem;
    color: var(--gray-1);
    letter-spacing: 0.02em;
    margin-bottom: 1.5rem;
  }

  .consistency-rate {
    color: var(--black);
    font-weight: 500;
    font-family: var(--mono);
    font-size: 0.65rem;
    letter-spacing: 0.02em;
  }

  /* ALMOST QUIT MARKER */
  .almost-quit-flag {
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    font-family: var(--mono);
    font-size: 0.6rem;
    color: #b85c38;
    letter-spacing: 0.04em;
    margin-top: 0.5rem;
    padding: 0.2rem 0.5rem;
    border: 1px solid rgba(184,92,56,0.3);
    background: rgba(184,92,56,0.05);
  }

  .almost-quit-flag::before { content: '⚑'; font-size: 0.7rem; }

  .nav-cta {
    font-family: var(--body); font-size: 0.875rem; font-weight: 500;
    color: var(--white); background: var(--black); border: none;
    padding: 0.5rem 1.25rem; cursor: pointer; letter-spacing: -0.01em;
    transition: background 0.2s;
  }
  .nav-cta:hover { background: var(--amber); }

  /* NAV ACCOUNT */
  .nav-account { display: flex; align-items: center; gap: 0.75rem; }
  .nav-account-email { font-family: var(--mono); font-size: 0.65rem; color: var(--gray-1); letter-spacing: 0.02em; max-width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .btn-nav-signout { font-family: var(--mono); font-size: 0.65rem; color: var(--gray-1); background: none; border: 1px solid var(--gray-2); padding: 0.3rem 0.7rem; cursor: pointer; letter-spacing: 0.02em; transition: color 0.15s, border-color 0.15s; }
  .btn-nav-signout:hover { color: #b85c38; border-color: #b85c38; }
  @media (max-width: 768px) { .nav-account-email { display: none; } }

  /* HERO */
  #hero { min-height: 100vh; display: flex; align-items: flex-end; padding: 0 3rem 5rem; padding-top: 6rem; position: relative; overflow: hidden; }
  .hero-inner { max-width: 860px; }

  .hero-eyebrow { font-family: var(--mono); font-size: 1rem; font-weight: 500; letter-spacing: 0.04em; color: var(--amber); margin-bottom: 2rem; opacity: 0; transform: translateY(16px); transition: opacity 0.7s ease, transform 0.7s ease; }
  .hero-heading { font-family: var(--display); font-size: clamp(2.8rem, 6vw, 5.5rem); font-weight: 700; line-height: 1.0; letter-spacing: -0.04em; color: var(--black); margin-bottom: 2.5rem; opacity: 0; transform: translateY(24px); transition: opacity 0.8s ease 0.1s, transform 0.8s ease 0.1s; }
  .hero-heading em { font-style: normal; color: var(--amber); }
  .hero-sub { font-family: var(--body); font-size: clamp(1rem, 1.5vw, 1.2rem); font-weight: 400; color: var(--gray-1); line-height: 1.7; max-width: 520px; margin-bottom: 3rem; opacity: 0; transform: translateY(16px); transition: opacity 0.8s ease 0.2s, transform 0.8s ease 0.2s; }
  .hero-actions { display: flex; align-items: center; gap: 1.5rem; opacity: 0; transform: translateY(16px); transition: opacity 0.8s ease 0.32s, transform 0.8s ease 0.32s; }

  .btn-primary { font-family: var(--body); font-size: 0.95rem; font-weight: 500; color: var(--white); background: var(--black); border: none; padding: 0.85rem 2rem; cursor: pointer; letter-spacing: -0.01em; transition: background 0.2s, transform 0.15s; }
  .btn-primary:hover { background: var(--amber); transform: translateY(-1px); }

  .btn-ghost { font-family: var(--body); font-size: 0.875rem; font-weight: 400; color: var(--gray-1); background: none; border: none; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; transition: color 0.2s; }
  .btn-ghost:hover { color: var(--black); }

  .hero-bg-numeral { position: absolute; right: -2rem; bottom: -4rem; font-family: var(--display); font-size: clamp(14rem, 22vw, 22rem); font-weight: 700; letter-spacing: -0.06em; color: transparent; -webkit-text-stroke: 1px var(--gray-2); line-height: 1; user-select: none; pointer-events: none; opacity: 0; transition: opacity 1.2s ease 0.4s; }

  .revealed .hero-eyebrow, .revealed .hero-heading, .revealed .hero-sub, .revealed .hero-actions, .revealed .hero-bg-numeral { opacity: 1; transform: translateY(0); }

  .scroll-hint { position: absolute; bottom: 2rem; left: 3rem; display: flex; align-items: center; gap: 0.75rem; opacity: 0; transition: opacity 0.8s ease 0.8s; }
  .revealed .scroll-hint { opacity: 1; }
  .scroll-hint-line { width: 32px; height: 1px; background: var(--gray-2); }
  .scroll-hint span { font-size: 0.7rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--gray-1); font-family: var(--body); }

  .hero-stats { display: flex; gap: 3rem; margin-top: 4rem; padding-top: 2rem; border-top: 1px solid var(--gray-2); opacity: 0; transform: translateY(12px); transition: opacity 0.8s ease 0.45s, transform 0.8s ease 0.45s; }
  .revealed .hero-stats { opacity: 1; transform: translateY(0); }
  .stat-num { font-family: var(--display); font-size: 1.6rem; font-weight: 700; letter-spacing: -0.03em; color: var(--black); display: block; }
  .stat-label { font-size: 0.78rem; color: var(--gray-1); font-family: var(--body); letter-spacing: 0.01em; }

  /* PROBLEM */
  #problem { padding: 8rem 3rem; border-top: 1px solid var(--gray-2); display: grid; grid-template-columns: 1fr 1fr; gap: 6rem; align-items: center; }
  .section-label { font-size: 0.7rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--amber); font-family: var(--body); font-weight: 500; margin-bottom: 1.5rem; display: block; }
  .section-heading { font-family: var(--display); font-size: clamp(1.8rem, 3vw, 2.8rem); font-weight: 700; letter-spacing: -0.03em; line-height: 1.1; color: var(--black); margin-bottom: 1.5rem; }
  .section-body { font-family: var(--body); font-size: 1rem; color: var(--gray-1); line-height: 1.8; }
  .section-body p + p { margin-top: 1rem; }
  .problem-blocks { display: flex; flex-direction: column; gap: 0; }
  .problem-block { padding: 1.75rem 0; border-bottom: 1px solid var(--gray-2); display: grid; grid-template-columns: 2.5rem 1fr; gap: 1rem; align-items: start; }
  .problem-block:first-child { border-top: 1px solid var(--gray-2); }
  .problem-num { font-family: var(--mono); font-size: 0.7rem; font-weight: 400; letter-spacing: 0.04em; color: var(--amber); padding-top: 0.2rem; }
  .problem-text { font-family: var(--body); font-size: 0.95rem; color: var(--black); line-height: 1.6; }
  .problem-text strong { font-weight: 500; display: block; margin-bottom: 0.25rem; }
  .problem-text span { color: var(--gray-1); font-size: 0.875rem; }

  .reveal { opacity: 0; transform: translateY(32px); transition: opacity 0.75s ease, transform 0.75s ease; }
  .reveal.visible { opacity: 1; transform: translateY(0); }
  .reveal-delay-1 { transition-delay: 0.1s; }
  .reveal-delay-2 { transition-delay: 0.2s; }
  .reveal-delay-3 { transition-delay: 0.3s; }
  .reveal-delay-4 { transition-delay: 0.4s; }

  footer { padding: 3rem; border-top: 1px solid var(--gray-2); font-size: 0.8rem; color: var(--gray-1); font-family: var(--body); display: flex; justify-content: space-between; align-items: center; }
  footer a { color: var(--gray-1); text-decoration: none; }
  footer a:hover { color: var(--black); }

  /* HOW IT WORKS */
  #how { padding: 8rem 3rem; border-top: 1px solid var(--gray-2); }
  .how-header { margin-bottom: 4rem; }
  .how-header .section-heading { max-width: 500px; }
  .how-steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3.5rem; }
  .how-step { display: flex; flex-direction: column; }
  .how-step-top { display: flex; flex-direction: column; gap: 1.25rem; margin-bottom: 1.5rem; }
  .how-step-num { font-family: var(--mono); font-size: 0.7rem; color: var(--amber); letter-spacing: 0.04em; }
  .how-step-visual { width: 100%; aspect-ratio: 120 / 64; background: var(--gray-3); }
  .how-step-title { font-family: var(--display); font-size: 1.15rem; font-weight: 700; letter-spacing: -0.02em; color: var(--black); margin-bottom: 0.75rem; line-height: 1.25; }
  .how-step-body { font-family: var(--body); font-size: 0.9rem; color: var(--gray-1); line-height: 1.65; }
  @media (max-width: 768px) { #how { padding: 5rem 1.25rem; } .how-steps { grid-template-columns: 1fr; gap: 2.5rem; } }

  /* YOUR LOG */
  #log { padding: 8rem 3rem 6rem; border-top: 1px solid var(--gray-2); }

  .user-curve-wrap { margin-bottom: 3.5rem; background: var(--black); padding: 2rem 2rem 1.5rem; display: none; }
  .user-curve-wrap.show { display: block; }
  .user-curve-label { font-family: var(--mono); font-size: 0.62rem; color: var(--amber); letter-spacing: 0.08em; display: block; margin-bottom: 1.25rem; }
  .user-curve-wrap svg { width: 100%; height: auto; overflow: visible; }
  .user-curve-phase-label { font-family: 'DM Mono', monospace; font-size: 8px; fill: #555; }

  /* TASK CHECK */
  .task-check-wrap { border: 1px solid var(--gray-2); padding: 1.75rem 2rem; margin-bottom: 3rem; display: none; }
  .task-check-wrap.show { display: block; }
  .task-check-goal { font-family: var(--mono); font-size: 0.62rem; color: var(--amber); letter-spacing: 0.08em; display: block; margin-bottom: 0.5rem; text-transform: uppercase; }
  .task-check-goal-text { font-family: var(--display); font-size: 1.1rem; font-weight: 700; letter-spacing: -0.02em; color: var(--black); line-height: 1.3; margin-bottom: 1.25rem; display: block; }
  .task-check-question { font-family: var(--body); font-size: 0.95rem; color: var(--gray-1); margin-bottom: 1rem; }
  .task-check-btns { display: flex; gap: 0.75rem; margin-bottom: 0; }
  .btn-task-yes { font-family: var(--mono); font-size: 0.75rem; color: var(--white); background: var(--black); border: none; padding: 0.6rem 1.5rem; cursor: pointer; letter-spacing: 0.02em; transition: background 0.15s; }
  .btn-task-yes:hover { background: #4a7c59; }
  .btn-task-no { font-family: var(--mono); font-size: 0.75rem; color: var(--gray-1); background: none; border: 1px solid var(--gray-2); padding: 0.6rem 1.5rem; cursor: pointer; letter-spacing: 0.02em; transition: border-color 0.15s, color 0.15s; }
  .btn-task-no:hover { border-color: #b85c38; color: #b85c38; }
  .task-check-response { margin-top: 1rem; font-family: var(--body); font-size: 0.88rem; line-height: 1.6; display: none; padding: 0.85rem 1rem; }
  .task-check-response.yes { background: #f0f7f0; color: #3a6647; display: block; }
  .task-check-response.no { background: var(--gray-3); color: var(--black); display: block; }
  .task-check-response.persistent-no { background: #0A0A0A; color: #ccc; display: block; }
  .task-check-reset { font-family: var(--mono); font-size: 0.62rem; color: var(--gray-1); background: none; border: none; cursor: pointer; letter-spacing: 0.02em; margin-top: 0.75rem; padding: 0; display: none; text-decoration: underline; text-underline-offset: 3px; }
  .task-check-reset:hover { color: var(--black); }

  .log-actions { display: flex; justify-content: flex-end; margin-bottom: 1.5rem; }
  .btn-start-fresh { font-family: var(--mono); font-size: 0.68rem; color: #999; background: none; border: 1px solid var(--gray-2); padding: 0.4rem 0.9rem; cursor: pointer; letter-spacing: 0.02em; transition: color 0.15s, border-color 0.15s; }
  .btn-start-fresh:hover { color: #b85c38; border-color: #b85c38; }

  .btn-delete-entry { font-family: var(--mono); font-size: 0.6rem; color: #aaa; background: none; border: none; cursor: pointer; letter-spacing: 0.02em; margin-top: 0.85rem; padding: 0; display: block; transition: color 0.15s; }
  .btn-delete-entry:hover { color: #b85c38; }

  .confirm-overlay { position: fixed; inset: 0; background: rgba(10,10,10,0.7); z-index: 500; display: none; align-items: center; justify-content: center; }
  .confirm-overlay.show { display: flex; }
  .confirm-box { background: var(--white); border: 1px solid var(--gray-2); padding: 2rem 2rem 1.5rem; max-width: 380px; width: calc(100% - 2rem); }
  .confirm-box p { font-family: var(--body); font-size: 0.95rem; color: var(--black); line-height: 1.6; margin-bottom: 1.5rem; }
  .confirm-box-actions { display: flex; gap: 0.75rem; justify-content: flex-end; }
  .btn-confirm-cancel { font-family: var(--mono); font-size: 0.72rem; color: var(--gray-1); background: none; border: 1px solid var(--gray-2); padding: 0.5rem 1rem; cursor: pointer; transition: border-color 0.15s; }
  .btn-confirm-cancel:hover { border-color: var(--black); color: var(--black); }
  .btn-confirm-delete { font-family: var(--mono); font-size: 0.72rem; color: var(--white); background: #b85c38; border: none; padding: 0.5rem 1rem; cursor: pointer; transition: opacity 0.15s; }
  .btn-confirm-delete:hover { opacity: 0.85; }

  .log-header { margin-bottom: 4rem; }
  .log-header-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 2rem; }
  .log-meta { font-family: var(--mono); font-size: 0.72rem; color: var(--gray-1); letter-spacing: 0.04em; padding-bottom: 0.4rem; }

  .milestone-banner { display: none; align-items: center; gap: 1rem; padding: 1rem 1.25rem; background: var(--amber); margin-bottom: 2.5rem; opacity: 0; transform: translateY(-8px); transition: opacity 0.5s ease, transform 0.5s ease; }
  .milestone-banner.show { display: flex; opacity: 1; transform: translateY(0); }
  .milestone-num { font-family: var(--display); font-size: 1.4rem; font-weight: 700; color: var(--black); letter-spacing: -0.02em; flex-shrink: 0; }
  .milestone-text { font-family: var(--body); font-size: 0.88rem; color: var(--black); line-height: 1.5; }
  .milestone-dismiss { margin-left: auto; background: none; border: none; font-family: var(--mono); font-size: 0.7rem; color: var(--black); opacity: 0.55; cursor: pointer; flex-shrink: 0; padding: 0.25rem 0.5rem; transition: opacity 0.15s; }
  .milestone-dismiss:hover { opacity: 1; }
  @media (max-width: 768px) { .milestone-banner { flex-wrap: wrap; padding: 1rem; } .milestone-dismiss { margin-left: 0; } }

  .log-empty { display: flex; gap: 3rem; align-items: flex-start; padding: 3rem 0; }
  .log-empty-line { width: 1px; min-height: 120px; background: var(--gray-2); flex-shrink: 0; margin-top: 0.25rem; }
  .log-empty-prompt { display: flex; flex-direction: column; gap: 1rem; }
  .log-empty-mono { font-family: var(--mono); font-size: 0.75rem; color: var(--gray-1); letter-spacing: 0.02em; }
  .log-empty-prompt p { font-family: var(--body); font-size: 0.95rem; color: var(--gray-1); line-height: 1.7; max-width: 420px; }

  .log-timeline { display: flex; flex-direction: column; gap: 0; padding-left: 0; }
  .timeline-entry { display: grid; grid-template-columns: 3rem 1px 1fr; gap: 0 1.5rem; align-items: start; opacity: 0; transform: translateY(16px); transition: opacity 0.5s ease, transform 0.5s ease; }
  .timeline-entry.visible { opacity: 1; transform: translateY(0); }
